<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gummy Bears</title>
<meta name="description" content="Translucent soft-body gummy bears you can grab, stretch, squash, throw and pour.">
<style>
  :root {
    --ink: #151413;
    --muted: #77716b;
    --line: rgba(21, 20, 19, 0.1);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); overflow: hidden; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; outline: none; }

  .hero { position: fixed; left: clamp(20px, 4.6vw, 76px); top: clamp(20px, 5vh, 60px); pointer-events: none; user-select: none; }
  .eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(64px, 10.5vw, 158px); line-height: 0.84; letter-spacing: -0.04em; margin: 0.2em 0 0.24em; }
  h1 span { display: block; }
  h1 span + span { padding-left: 0.5em; }
  .sub { font-size: 15px; line-height: 1.55; color: var(--muted); max-width: 300px; margin: 0; }

  .card { position: fixed; right: clamp(16px, 3.6vw, 60px); top: 50%; transform: translateY(-50%); width: 276px; padding: 22px; background: rgba(255, 255, 255, 0.84); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 30px 60px -40px rgba(0, 0, 0, 0.28); }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .label { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 14px 0 4px; }
  .sw { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px; font: inherit; color: var(--ink); }
  .sw i { width: 32px; height: 32px; border-radius: 50%; display: block; background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,0) 22%), radial-gradient(circle at 60% 70%, var(--d) 0%, var(--c) 70%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.06), 0 6px 12px -6px var(--c); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
  .sw:hover i { transform: scale(1.14) translateY(-2px); }
  .sw:active i { transform: scale(.9); }
  .sw span { font-size: 10.5px; color: var(--muted); }
  .sep { height: 1px; background: var(--line); margin: 18px 0; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 8px 0 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--ink) var(--p, 55%), rgba(21,20,19,.14) var(--p, 55%)); border-radius: 2px; }
  input[type=range]::-moz-range-track { height: 2px; background: rgba(21,20,19,.14); border-radius: 2px; }
  input[type=range]::-moz-range-progress { height: 2px; background: var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); margin-top: -7px; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); }
  .val { font-size: 13px; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 20px; }
  .stats b { display: block; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 38px; line-height: 1; margin-top: 8px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .bar { height: 2px; background: rgba(21,20,19,.1); margin-top: 10px; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); }
  .pour { width: 100%; appearance: none; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 500 14px var(--sans); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform .2s, background .2s; }
  .pour:hover { background: #000; transform: translateY(-1px); }
  .pour:active { transform: scale(.98); }
  .pour span { font-size: 16px; }
  .hint { position: fixed; left: clamp(20px, 4.6vw, 76px); bottom: clamp(18px, 4vh, 40px); font-size: 12px; color: var(--muted); letter-spacing: .02em; pointer-events: none; user-select: none; }

  #cursor { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 10; opacity: 0; transition: opacity .2s; }
  #cursor::before { content: ""; position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid rgba(21,20,19,.5); background: rgba(21,20,19,0); transition: transform .35s cubic-bezier(.3,1.5,.5,1), background .25s, border-color .25s; }
  #cursor.on { opacity: 1; }
  #cursor.hover::before { transform: scale(1.3); border-color: rgba(21,20,19,.75); }
  #cursor.grab::before { transform: scale(2.1); background: rgba(21,20,19,.06); border-color: rgba(21,20,19,.35); border-width: 1px; }

  @media (max-width: 760px) {
    .hero { left: 18px; top: 16px; }
    h1 { font-size: 60px; }
    .sub { font-size: 13px; max-width: 250px; }
    .card { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; transform: none; padding: 14px 16px 16px; border-radius: 18px; }
    .swatches { margin: 10px 0 0; }
    .sw i { width: 26px; height: 26px; }
    .sep { margin: 12px 0; }
    .stats { margin: 12px 0 14px; }
    .stats b { font-size: 28px; }
    .pour { padding: 12px 16px; }
    .hint { display: none; }
  }
  @media (hover: none) { #cursor { display: none; } }
</style>

<body>
<canvas id="c" aria-label="Gummy bears on a white table. Drag to stretch, flick to throw, press down to squash."></canvas>

<header class="hero">
  <div class="eyebrow">Soft Candy Study &nbsp;·&nbsp; Nº 05</div>
  <h1><span>Gummy</span><span>Bears.</span></h1>
  <p class="sub">Five flavors of hand-poured jelly. Grab one, stretch it, squash it, throw it — it always wobbles back.</p>
</header>

<aside class="card" id="card">
  <div class="row"><span class="label">Flavors</span><span class="label">Tap to drop</span></div>
  <div class="swatches" id="swatches"></div>
  <div class="sep"></div>
  <div class="row"><span class="label">Wobble</span><span class="val" id="wobV">55</span></div>
  <input type="range" id="wob" min="0" max="100" value="55" aria-label="Wobble">
  <div class="stats">
    <div><span class="label">Stretch</span><b id="st">0%</b><div class="bar"><i id="stb"></i></div></div>
    <div><span class="label">Bounces</span><b id="bo">0</b></div>
  </div>
  <button class="pour" id="pour">Pour more bears <span>↓</span></button>
</aside>

<div class="hint">Drag to stretch &nbsp;·&nbsp; Flick to throw &nbsp;·&nbsp; Press down to squash</div>
<div id="cursor"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Flavors
 * ------------------------------------------------------------------ */
const FLAVORS = [
  { name: 'Cherry',    css: '#e3223c', deep: '#9e0018', color: 0xff8a94, att: 0xe0102c, dist: 0.42, shadow: [0.86, 0.20, 0.27] },
  { name: 'Orange',    css: '#ff8a1e', deep: '#d65200', color: 0xffc080, att: 0xff7a0a, dist: 0.55, shadow: [0.98, 0.52, 0.14] },
  { name: 'Lemon',     css: '#ffd630', deep: '#e0a800', color: 0xfff6a8, att: 0xffd21a, dist: 0.75, shadow: [0.98, 0.84, 0.22] },
  { name: 'Apple',     css: '#76c623', deep: '#3f8f00', color: 0xd4f7a0, att: 0x6cc010, dist: 0.5, shadow: [0.46, 0.78, 0.20] },
  { name: 'Pineapple', css: '#f4ecd2', deep: '#e2d19c', color: 0xfffaf0, att: 0xffe9b0, dist: 1.6, shadow: [0.86, 0.81, 0.64] },
];

/* ------------------------------------------------------------------ *
 *  Rest shape (bear local space, feet on y = 0, facing +z)
 * ------------------------------------------------------------------ */
// mass points
const HEAD = 0, EARL = 1, EARR = 2, SNOUT = 3, BODY = 4, BELLY = 5, HANDL = 6, HANDR = 7, FOOTL = 8, FOOTR = 9;
const NP = 10;
const REST = [
  [0, 0.90, 0], [-0.19, 1.08, -0.01], [0.19, 1.08, -0.01], [0, 0.845, 0.18],
  [0, 0.58, 0], [0, 0.32, 0],
  [-0.335, 0.495, 0.135], [0.335, 0.495, 0.135],
  [-0.185, 0.095, 0.16], [0.185, 0.095, 0.16],
];
const MASS = [1.0, 0.12, 0.12, 0.2, 1.2, 1.6, 0.25, 0.25, 0.35, 0.35];
const RAD = [0.24, 0.08, 0.08, 0.09, 0.21, 0.315, 0.085, 0.085, 0.095, 0.095];
const SHADOW_RAD = [0.26, 0.08, 0.08, 0.1, 0.23, 0.29, 0.08, 0.08, 0.1, 0.1];
const ALPHA_SCALE = [1, 0.55, 0.55, 0.85, 1, 1, 0.5, 0.5, 0.75, 0.75];
const SHOULDER = [[-0.19, 0.64, 0.05], [0.19, 0.64, 0.05]];
const HIP = [[-0.14, 0.24, 0.05], [0.14, 0.24, 0.05]];
const HEAD_CLUSTER = [HEAD, EARL, EARR, SNOUT];

// springs: [i, j, stiffness]  (first five are the visible strands)
const SPRINGS = [
  [HEAD, BODY, 260], [BODY, HANDL, 75], [BODY, HANDR, 75], [BELLY, FOOTL, 130], [BELLY, FOOTR, 130],
  [HEAD, EARL, 55], [HEAD, EARR, 55], [HEAD, SNOUT, 90], [BODY, BELLY, 320],
].map(([i, j, k]) => [i, j, k, Math.hypot(REST[j][0] - REST[i][0], REST[j][1] - REST[i][1], REST[j][2] - REST[i][2])]);
const STRANDS = 5;
const MAX_STRETCH = 3.4;

/* ------------------------------------------------------------------ *
 *  Implicit surface (signed distance + smooth union)
 * ------------------------------------------------------------------ */
const E = {
  belly: [0, 0.32, 0, 0.29, 0.29, 0.235],
  chest: [0, 0.58, 0, 0.235, 0.22, 0.19],
  head:  [0, 0.90, 0, 0.27, 0.235, 0.20],
  snout: [0, 0.835, 0.165, 0.12, 0.085, 0.09],
  nose:  [0, 0.873, 0.252, 0.043, 0.031, 0.028],
  earL:  [-0.19, 1.08, -0.01, 0.085, 0.08, 0.055],
  earR:  [0.19, 1.08, -0.01, 0.085, 0.08, 0.055],
  eyeL:  [-0.085, 0.958, 0.188, 0.027, 0.029, 0.022],
  eyeR:  [0.085, 0.958, 0.188, 0.027, 0.029, 0.022],
  handL: [-0.335, 0.495, 0.135, 0.08, 0.08, 0.072],
  handR: [0.335, 0.495, 0.135, 0.08, 0.08, 0.072],
  footL: [-0.185, 0.095, 0.16, 0.10, 0.095, 0.11],
  footR: [0.185, 0.095, 0.16, 0.10, 0.095, 0.11],
};
const ARM_R = 0.068, LEG_R = 0.088;

function sdE(e, x, y, z) {
  const ax = (x - e[0]) / e[3], ay = (y - e[1]) / e[4], az = (z - e[2]) / e[5];
  const k0 = Math.sqrt(ax * ax + ay * ay + az * az);
  const bx = ax / e[3], by = ay / e[4], bz = az / e[5];
  const k1 = Math.sqrt(bx * bx + by * by + bz * bz);
  return k1 < 1e-9 ? -Math.min(e[3], e[4], e[5]) : k0 * (k0 - 1) / k1;
}
function sdCap(a, b, r, x, y, z) {
  const pax = x - a[0], pay = y - a[1], paz = z - a[2];
  const bax = b[0] - a[0], bay = b[1] - a[1], baz = b[2] - a[2];
  const h = Math.min(1, Math.max(0, (pax * bax + pay * bay + paz * baz) / (bax * bax + bay * bay + baz * baz)));
  const dx = pax - bax * h, dy = pay - bay * h, dz = paz - baz * h;
  return Math.sqrt(dx * dx + dy * dy + dz * dz) - r;
}
function smin(a, b, k) {
  const h = Math.max(k - Math.abs(a - b), 0) / k;
  return Math.min(a, b) - h * h * k * 0.25;
}
function bearSDF(x, y, z) {
  let d = sdE(E.belly, x, y, z);
  d = smin(d, sdE(E.chest, x, y, z), 0.14);
  d = smin(d, sdE(E.head, x, y, z), 0.11);
  d = smin(d, sdE(E.snout, x, y, z), 0.07);
  d = smin(d, sdE(E.earL, x, y, z), 0.05);
  d = smin(d, sdE(E.earR, x, y, z), 0.05);
  d = smin(d, sdCap(SHOULDER[0], REST[HANDL], ARM_R, x, y, z), 0.07);
  d = smin(d, sdCap(SHOULDER[1], REST[HANDR], ARM_R, x, y, z), 0.07);
  d = smin(d, sdE(E.handL, x, y, z), 0.04);
  d = smin(d, sdE(E.handR, x, y, z), 0.04);
  d = smin(d, sdCap(HIP[0], REST[FOOTL], LEG_R, x, y, z), 0.09);
  d = smin(d, sdCap(HIP[1], REST[FOOTR], LEG_R, x, y, z), 0.09);
  d = smin(d, sdE(E.footL, x, y, z), 0.05);
  d = smin(d, sdE(E.footR, x, y, z), 0.05);
  d = smin(d, sdE(E.eyeL, x, y, z), 0.012);
  d = smin(d, sdE(E.eyeR, x, y, z), 0.012);
  d = smin(d, sdE(E.nose, x, y, z), 0.02);
  return d;
}

// Bones used for rendering: 10 point bones + 5 strand bones
const NB = 15;
const NECK_A = [0, 0.66, 0], NECK_B = [0, 0.82, 0];
const BONE_SDF = [
  (x, y, z) => Math.min(sdE(E.head, x, y, z), sdE(E.eyeL, x, y, z), sdE(E.eyeR, x, y, z)),
  (x, y, z) => sdE(E.earL, x, y, z),
  (x, y, z) => sdE(E.earR, x, y, z),
  (x, y, z) => Math.min(sdE(E.snout, x, y, z), sdE(E.nose, x, y, z)),
  (x, y, z) => sdE(E.chest, x, y, z),
  (x, y, z) => sdE(E.belly, x, y, z),
  (x, y, z) => sdE(E.handL, x, y, z),
  (x, y, z) => sdE(E.handR, x, y, z),
  (x, y, z) => sdE(E.footL, x, y, z),
  (x, y, z) => sdE(E.footR, x, y, z),
  (x, y, z) => sdCap(NECK_A, NECK_B, 0.17, x, y, z) + 0.01,
  (x, y, z) => sdCap(SHOULDER[0], REST[HANDL], ARM_R, x, y, z) - 0.006,
  (x, y, z) => sdCap(SHOULDER[1], REST[HANDR], ARM_R, x, y, z) - 0.006,
  (x, y, z) => sdCap(HIP[0], REST[FOOTL], LEG_R, x, y, z) - 0.006,
  (x, y, z) => sdCap(HIP[1], REST[FOOTR], LEG_R, x, y, z) - 0.006,
];

/* Polygonize the rest pose once with marching cubes, then weld, compute
   smooth normals, interior thickness and skin weights per vertex. */
function buildBearGeometry() {
  const N = 88, C = [0, 0.58, 0.02], H = 0.66;
  const mc = new MarchingCubes(N, new THREE.MeshBasicMaterial(), false, false, 90000);
  mc.isolation = 0;
  const f = mc.field, half = N / 2;
  for (let z = 0; z < N; z++) {
    const wz = C[2] + (z - half) / half * H;
    for (let y = 0; y < N; y++) {
      const wy = C[1] + (y - half) / half * H;
      for (let x = 0; x < N; x++) {
        const wx = C[0] + (x - half) / half * H;
        // cheap reject far from the bear
        const ox = Math.max(Math.abs(wx) - 0.5, 0), oy = Math.max(Math.abs(wy - 0.58) - 0.66, 0), oz = Math.max(Math.abs(wz - 0.02) - 0.36, 0);
        f[x + y * N + z * N * N] = (ox + oy + oz > 0.06) ? -1 : -bearSDF(wx, wy, wz);
      }
    }
  }
  mc.update();
  const count = mc.count;
  const src = mc.geometry.getAttribute('position').array;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = C[0] + src[i * 3] * H;
    pos[i * 3 + 1] = C[1] + src[i * 3 + 1] * H;
    pos[i * 3 + 2] = C[2] + src[i * 3 + 2] * H;
  }
  mc.geometry.dispose();
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g = mergeVertices(g, 1e-5);

  const P = g.getAttribute('position').array, idx = g.getIndex().array;
  const nv = P.length / 3;

  // make sure triangles wind outward
  let vol = 0;
  for (let t = 0; t < idx.length; t += 3) {
    const a = idx[t] * 3, b = idx[t + 1] * 3, c = idx[t + 2] * 3;
    vol += P[a] * (P[b + 1] * P[c + 2] - P[b + 2] * P[c + 1]) - P[a + 1] * (P[b] * P[c + 2] - P[b + 2] * P[c]) + P[a + 2] * (P[b] * P[c + 1] - P[b + 1] * P[c]);
  }
  if (vol < 0) for (let t = 0; t < idx.length; t += 3) { const s = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = s; }

  const nrm = new Float32Array(nv * 3), thick = new Float32Array(nv);
  const sIdx = new Float32Array(nv * 4), sW = new Float32Array(nv * 4);
  const eps = 0.0015, w = new Float32Array(NB), order = [...Array(NB).keys()];
  for (let i = 0; i < nv; i++) {
    const x = P[i * 3], y = P[i * 3 + 1], z = P[i * 3 + 2];
    let nx = bearSDF(x + eps, y, z) - bearSDF(x - eps, y, z);
    let ny = bearSDF(x, y + eps, z) - bearSDF(x, y - eps, z);
    let nz = bearSDF(x, y, z + eps) - bearSDF(x, y, z - eps);
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    nrm[i * 3] = nx; nrm[i * 3 + 1] = ny; nrm[i * 3 + 2] = nz;
    // thickness: march inward along -n until we leave the body
    let t = 0.006;
    for (let s = 0; s < 80 && t < 1.2; s++) {
      const d = bearSDF(x - nx * t, y - ny * t, z - nz * t);
      if (d > 0) break;
      t += Math.max(-d, 0.006);
    }
    thick[i] = Math.min(Math.max(t, 0.03), 1.0);
    // skin weights from proximity to each bone's primitive
    for (let b = 0; b < NB; b++) w[b] = Math.exp(-Math.max(BONE_SDF[b](x, y, z), -0.03) / 0.022);
    order.sort((a, b) => w[b] - w[a]);
    const sum = w[order[0]] + w[order[1]] + w[order[2]] + w[order[3]];
    for (let k = 0; k < 4; k++) { sIdx[i * 4 + k] = order[k]; sW[i * 4 + k] = w[order[k]] / sum; }
  }
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('aThick', new THREE.BufferAttribute(thick, 1));
  g.setAttribute('aSkinIdx', new THREE.BufferAttribute(sIdx, 4));
  g.setAttribute('aSkinW', new THREE.BufferAttribute(sW, 4));
  g.computeBoundingSphere();
  return g;
}

/* ------------------------------------------------------------------ *
 *  Small 3x3 / quaternion helpers (row-major arrays)
 * ------------------------------------------------------------------ */
function quatToMat(q, R) {
  const [x, y, z, w] = q;
  const xx = x * x, yy = y * y, zz = z * z, xy = x * y, xz = x * z, yz = y * z, wx = w * x, wy = w * y, wz = w * z;
  R[0] = 1 - 2 * (yy + zz); R[1] = 2 * (xy - wz); R[2] = 2 * (xz + wy);
  R[3] = 2 * (xy + wz); R[4] = 1 - 2 * (xx + zz); R[5] = 2 * (yz - wx);
  R[6] = 2 * (xz - wy); R[7] = 2 * (yz + wx); R[8] = 1 - 2 * (xx + yy);
}
function quatMulInto(a, b, out) { // out = a * b
  const ax = a[0], ay = a[1], az = a[2], aw = a[3], bx = b[0], by = b[1], bz = b[2], bw = b[3];
  out[0] = aw * bx + ax * bw + ay * bz - az * by;
  out[1] = aw * by - ax * bz + ay * bw + az * bx;
  out[2] = aw * bz + ax * by - ay * bx + az * bw;
  out[3] = aw * bw - ax * bx - ay * by - az * bz;
}
const _dq = [0, 0, 0, 1];

  const press = (b.grabY0 - _hit.y) / Math.max(b.grabY0, 0.2);
  if (!b.pressing && press > 0.08 && b.grabY0 > b.c[1]) b.pressing = true;
  else if (b.pressing && press < 0.03) b.pressing = false;
  // while pressing, the pressed part counts fully so the whole body squashes evenly
  b.fit = b.pressing ? FIT_FREE : FIT_GRAB[b.grab];
  if (b.pressing) _hit.y = Math.max(_hit.y, b.grabY0 * 0.6);
  b.biasTarget = b.pressing ? THREE.MathUtils.clamp(1 - Math.min(press, 0.5) * 0.6, 0.7, 1) : 1;
  const inst = _hit.clone().sub(b.target).divideScalar(Math.max(dt, 1 / 240));
  b.tvel.lerp(inst, 0.45);
  b.target.copy(_hit);
}

// UI
const swWrap = document.getElementById('swatches');
FLAVORS.forEach((f, i) => {
  const btn = document.createElement('button');
  btn.className = 'sw'; btn.style.setProperty('--c', f.css); btn.style.setProperty('--d', f.deep);
  btn.innerHTML = `<i></i><span>${f.name}</span>`;
  btn.setAttribute('aria-label', `Drop a ${f.name.toLowerCase()} bear`);
  btn.addEventListener('click', () => pour([i]));
  swWrap.appendChild(btn);
});
const wob = document.getElementById('wob'), wobV = document.getElementById('wobV');
wob.addEventListener('input', () => { setWobble(+wob.value); wobV.textContent = wob.value; wob.style.setProperty('--p', wob.value + '%'); });
wob.style.setProperty('--p', wob.value + '%');
document.getElementById('pour').addEventListener('click', () => {
  pour(Array.from({ length: 5 + Math.floor(Math.random() * 3) }, () => Math.floor(Math.random() * FLAVORS.length)));
});
const stEl = document.getElementById('st'), stBar = document.getElementById('stb'), boEl = document.getElementById('bo');

/* ------------------------------------------------------------------ *
 *  Loop
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
let acc = 0, shownStretch = 0, hoverCheck = 0, lastStretchText = '', lastBounces = -1;
function tick() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  updateDrag(dt);
  acc += dt;
  let n = 0;
  while (acc >= H && n < 10) {
    for (const b of bears) b.step(H);
    collideBears();
    acc -= H; n++;
  }
  if (n === 10) acc = 0;
  let maxS = 1;
  for (let i = bears.length - 1; i >= 0; i--) {
    const b = bears[i];
    b.frame(dt);
    b.updateRender();
    maxS = Math.max(maxS, b.maxStretch);
    if (b.dying && b.life <= 0) { b.dispose(); bears.splice(i, 1); }
  }
  // readouts
  shownStretch += (Math.max(0, maxS - 1.05) - shownStretch) * Math.min(1, dt * 12);
  const pct = Math.max(0, Math.round(shownStretch * 100));
  const txt = pct + '%';
  if (txt !== lastStretchText) { stEl.textContent = txt; stBar.style.width = Math.min(100, pct / ((MAX_STRETCH - 1) * 100) * 100) + '%'; lastStretchText = txt; }
  if (bounces !== lastBounces) { boEl.textContent = bounces; lastBounces = bounces; }
  // hover state for the cursor
  if (!drag && pointer.inside && (hoverCheck = (hoverCheck + 1) % 3) === 0) cursor.classList.toggle('hover', !!pick());
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
